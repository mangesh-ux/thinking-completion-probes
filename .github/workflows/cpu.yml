name: CPU verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - run: python -m pip install -r requirements/cpu.txt -r requirements/dev.txt -e .
      - run: tcp verify
      - run: python -m pytest
